<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="cabBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0c071e"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="neonBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      .pixel-text {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        text-anchor: middle;
      }
      
      /* Crane horizontal motion */
      @keyframes craneMove {
        0%, 15% { transform: translateX(200px); }
        35%, 65% { transform: translateX(200px); }
        75%, 90% { transform: translateX(45px); }
        98%, 100% { transform: translateX(200px); }
      }
      
      /* Cable drop & lift */
      @keyframes cableDrop {
        0%, 15% { height: 25px; }
        25%, 45% { height: 110px; }
        55%, 100% { height: 25px; }
      }
      
      /* Claw body vertical position matching cable drop */
      @keyframes clawVertical {
        0%, 15% { transform: translateY(0px); }
        25%, 45% { transform: translateY(85px); }
        55%, 100% { transform: translateY(0px); }
      }
      
      /* Left claw pinch */
      @keyframes pinchLeft {
        0%, 20% { transform: rotate(0deg); }
        28%, 88% { transform: rotate(24deg); }
        92%, 100% { transform: rotate(0deg); }
      }
      
      /* Right claw pinch */
      @keyframes pinchRight {
        0%, 20% { transform: rotate(0deg); }
        28%, 88% { transform: rotate(-24deg); }
        92%, 100% { transform: rotate(0deg); }
      }

      /* Prize being caught and moved */
      @keyframes prizeCatch {
        0%, 27% { opacity: 0; transform: translate(200px, 155px) scale(0.9); }
        28%, 45% { opacity: 1; transform: translate(200px, 155px) scale(1); }
        55%, 75% { opacity: 1; transform: translate(200px, 70px) scale(1); }
        85% { opacity: 1; transform: translate(45px, 70px) scale(1); }
        92% { opacity: 1; transform: translate(45px, 160px) scale(0.9); }
        95%, 100% { opacity: 0; transform: translate(45px, 160px) scale(0.5); }
      }

      /* Flashing arcade winner marquee */
      @keyframes winnerBlink {
        0%, 49% { opacity: 0.2; }
        50%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #facc15); }
      }
      
      /* Coin blink */
      @keyframes coinFlash {
        0%, 50% { fill: #facc15; }
        51%, 100% { fill: #38bdf8; }
      }

      .crane-rig {
        animation: craneMove 9s ease-in-out infinite;
      }
      .cable-line {
        animation: cableDrop 9s ease-in-out infinite;
      }
      .claw-assembly {
        animation: clawVertical 9s ease-in-out infinite;
      }
      .prong-left {
        transform-origin: 0 0;
        animation: pinchLeft 9s ease-in-out infinite;
      }
      .prong-right {
        transform-origin: 0 0;
        animation: pinchRight 9s ease-in-out infinite;
      }
      .caught-plush {
        animation: prizeCatch 9s ease-in-out infinite;
      }
      .marquee-alert {
        animation: winnerBlink 1.2s steps(2, start) infinite;
      }
      .insert-coin-txt {
        animation: coinFlash 1.6s steps(2, start) infinite;
      }
    </style>
  </defs>

  <!-- Arcade Cabinet Shell -->
  <rect x="10" y="8" width="480" height="304" rx="14" fill="url(#cabBg)" stroke="#3b0764" stroke-width="4"/>
  <rect x="14" y="12" width="472" height="296" rx="11" fill="none" stroke="url(#neonBar)" stroke-width="2.5" opacity="0.85"/>

  <!-- Top Marquee Header -->
  <rect x="25" y="20" width="450" height="42" rx="6" fill="#0f0728" stroke="#a855f7" stroke-width="2"/>
  <text x="250" y="46" class="pixel-text" font-size="13" fill="#f43f5e" letter-spacing="2">🕹️ CLAW MACHINE 🧸</text>

  <!-- Glass Chamber Background -->
  <rect x="25" y="68" width="450" height="190" rx="4" fill="#070314" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Arcade Grid inside chamber -->
  <path d="M 25 110 L 475 110 M 25 150 L 475 150 M 25 190 L 475 190 M 25 230 L 475 230" stroke="#1e1b4b" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 90 68 L 90 258 M 160 68 L 160 258 M 230 68 L 230 258 M 300 68 L 300 258 M 370 68 L 370 258 M 440 68 L 440 258" stroke="#1e1b4b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Prize Chute Box (Left) -->
  <rect x="35" y="195" width="60" height="63" rx="4" fill="#1e1b4b" stroke="#06b6d4" stroke-width="2"/>
  <rect x="42" y="205" width="46" height="46" rx="2" fill="#030712" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="65" y="248" class="pixel-text" font-size="7" fill="#38bdf8">DROP</text>

  <!-- Prize Pile at the bottom -->
  <!-- Cute Pixel Chick / Duck -->
  <g transform="translate(130, 218)">
    <rect x="6" y="0" width="16" height="14" rx="3" fill="#facc15"/>
    <rect x="2" y="6" width="24" height="16" rx="4" fill="#facc15"/>
    <rect x="8" y="4" width="3" height="3" fill="#000"/>
    <rect x="18" y="4" width="3" height="3" fill="#000"/>
    <rect x="11" y="7" width="6" height="4" rx="1" fill="#f97316"/>
  </g>

  <!-- Cute Pixel Pink Bear/Bunny -->
  <g transform="translate(250, 216)">
    <circle cx="5" cy="4" r="4" fill="#f43f5e"/>
    <circle cx="23" cy="4" r="4" fill="#f43f5e"/>
    <rect x="2" y="4" width="24" height="20" rx="6" fill="#fb7185"/>
    <rect x="7" y="9" width="3" height="3" fill="#1e1b4b"/>
    <rect x="18" y="9" width="3" height="3" fill="#1e1b4b"/>
    <circle cx="14" cy="13" r="2.5" fill="#f43f5e"/>
  </g>

  <!-- Cute Pixel Blue Star Slime -->
  <g transform="translate(320, 222)">
    <path d="M 12 0 L 16 9 L 26 9 L 18 15 L 21 24 L 12 18 L 3 24 L 6 15 L -2 9 L 8 9 Z" fill="#38bdf8"/>
    <circle cx="9" cy="11" r="1.5" fill="#0f172a"/>
    <circle cx="15" cy="11" r="1.5" fill="#0f172a"/>
  </g>

  <!-- Cute Pixel KOF Fire / Power Orb -->
  <g transform="translate(390, 218)">
    <circle cx="14" cy="14" r="12" fill="#8b5cf6"/>
    <circle cx="14" cy="14" r="8" fill="#c084fc"/>
    <polygon points="14,4 18,14 14,24 10,14" fill="#fdf4ff"/>
  </g>

  <!-- Caught Prize (Follows animation path) -->
  <g class="caught-plush">
    <circle cx="0" cy="-4" r="4" fill="#f43f5e"/>
    <circle cx="14" cy="-4" r="4" fill="#f43f5e"/>
    <rect x="-3" y="-3" width="20" height="18" rx="5" fill="#fb7185"/>
    <rect x="1" y="2" width="3" height="3" fill="#1e1b4b"/>
    <rect x="10" y="2" width="3" height="3" fill="#1e1b4b"/>
    <circle cx="7" cy="6" r="2" fill="#f43f5e"/>
    <text x="7" y="-12" class="pixel-text" font-size="7" fill="#fef08a" text-anchor="middle">★ GET! ★</text>
  </g>

  <!-- Crane Top Rail -->
  <rect x="26" y="69" width="448" height="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <rect x="28" y="71" width="444" height="2" fill="#94a3b8" opacity="0.6"/>

  <!-- Animated Crane Rig -->
  <g class="crane-rig">
    <!-- Trolley on rail -->
    <rect x="-14" y="69" width="28" height="10" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <circle cx="0" cy="74" r="2.5" fill="#ef4444"/>

    <!-- Steel Cable line (grows with cableDrop) -->
    <line x1="0" y1="79" x2="0" y2="79" stroke="#94a3b8" stroke-width="2.5" class="cable-line" stroke-linecap="round"/>

    <!-- Claw Assembly (moves down with clawVertical) -->
    <g class="claw-assembly" transform="translate(0, 79)">
      <!-- Claw hub / motor -->
      <circle cx="0" cy="8" r="7" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
      <circle cx="0" cy="8" r="3" fill="#f59e0b"/>

      <!-- Left prong -->
      <g transform="translate(-4, 12)">
        <g class="prong-left">
          <path d="M 0 0 L -8 14 L -4 24 L -1 23 L -5 14 L 0 2 Z" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
          <circle cx="-3" cy="23.5" r="2" fill="#f43f5e"/>
        </g>
      </g>

      <!-- Right prong -->
      <g transform="translate(4, 12)">
        <g class="prong-right">
          <path d="M 0 0 L 8 14 L 4 24 L 1 23 L 5 14 L 0 2 Z" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
          <circle cx="3" cy="23.5" r="2" fill="#f43f5e"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Glass Overlay & Reflection -->
  <rect x="25" y="68" width="450" height="190" rx="4" fill="url(#glassGrad)" pointer-events="none"/>
  <polygon points="35,69 110,69 60,257 35,257" fill="#ffffff" opacity="0.04" pointer-events="none"/>
  <polygon points="135,69 165,69 85,257 65,257" fill="#ffffff" opacity="0.02" pointer-events="none"/>

  <!-- Bottom Control Panel / Dashboard -->
  <rect x="25" y="262" width="450" height="42" rx="5" fill="#0f0728" stroke="#6b21a8" stroke-width="1.5"/>
  
  <!-- Flashing Marquee Indicator -->
  <g class="marquee-alert">
    <rect x="35" y="268" width="90" height="18" rx="3" fill="#e11d48"/>
    <text x="80" y="281" class="pixel-text" font-size="8" fill="#ffffff">WINNER!</text>
  </g>

  <!-- Joypad / Buttons graphic -->
  <circle cx="210" cy="282" r="9" fill="#1e1b4b" stroke="#475569" stroke-width="1"/>
  <circle cx="210" cy="280" r="4" fill="#dc2626"/>
  
  <circle cx="245" cy="280" r="5.5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1"/>
  <circle cx="262" cy="280" r="5.5" fill="#10b981" stroke="#047857" stroke-width="1"/>
  <circle cx="279" cy="280" r="5.5" fill="#eab308" stroke="#a16207" stroke-width="1"/>

  <!-- Flashing Insert Coin / Ready text -->
  <text x="390" y="285" class="pixel-text insert-coin-txt" font-size="8" letter-spacing="1">INSERT COIN</text>
  <text x="390" y="296" class="pixel-text" font-size="6" fill="#94a3b8">CREDIT: 01</text>
</svg>

